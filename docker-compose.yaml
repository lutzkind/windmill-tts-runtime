services:
  kokoro-tts:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    restart: unless-stopped
    expose: ["8880"]
    environment:
      UVICORN_PORT: "8880"
      ENABLE_UI: "false"
      LOG_LEVEL: "info"
      TTS_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["speaches-ai/Kokoro-82M-v1.0-ONNX","speaches-ai/piper-de_DE-thorsten-high"]'
    volumes:
      - speaches-model-cache:/home/ubuntu/.cache/huggingface/hub
    labels:
      - traefik.enable=false
    networks: [windmill]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 180s

networks:
  windmill:
    external: true
    name: m9qaud6gadgni5bxty30bkdl

volumes:
  speaches-model-cache:
