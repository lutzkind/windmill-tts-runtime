name: CI heavy verification (self-hosted, non-blocking)

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windmill-tts-runtime-ci-standard-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy:
    name: Server-side heavy checks
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate declared heavy configuration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -f Dockerfile ]; then
            docker build --pull=false --tag ci-standard-${GITHUB_SHA} .
          else
            compose_file=""
            for candidate in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
              if [ -f "$candidate" ]; then
                compose_file="$candidate"
                break
              fi
            done
            if [ -n "$compose_file" ]; then
              docker compose -f "$compose_file" config --quiet
            else
              echo 'Heavy profile requires repository-specific disposable-service checks.'
            fi
          fi
      - name: Clean disposable resources
        if: always()
        shell: bash
        run: |
          set +e
          docker compose down --volumes --remove-orphans 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
